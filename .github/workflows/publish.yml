# Publish the Turnout image (proxy, console and CLI) to GitHub Container Registry on a version tag:
#   git tag v1.0.0 && git push origin v1.0.0   →   ghcr.io/<owner>/turnout:1.0.0, :1.0 and :latest
# Optional: Turnout defaults to turnout:local, built from a checkout. Use a published image with --image or TURNOUT_IMAGE.
name: Publish image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write # push to ghcr.io with GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/turnout
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
