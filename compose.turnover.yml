# Turnover, as an overlay on Flagsmith's official compose file (compose.flagsmith.yml). compose.yaml includes both, so plain
# `docker compose …` works from any shell.
#
# Networks: each service joins only the networks it needs.
#   default  Flagsmith, its Postgres, the console and the one-off CLI (the admin side)
#   sdk      Flagsmith and the proxy: flag reads and events (declared in compose.flagsmith.yml)
#   feed     the proxy and the console: the traffic feed (:8081) and judge mode's simulated visitors (:8080)
#   apps     the proxy and the releases (the demo shops, compose.demo.yml): the shops can't reach Flagsmith or the console
# So the public proxy can't reach Postgres or the console's Flagsmith-admin traffic, and each service gets only the
# keys it needs: the proxy never sees the admin key or the admin login.
#
# Published ports are bound to ${TURNOVER_PUBLISH_HOST:-127.0.0.1}. Links use 127.0.0.1 rather than localhost: on
# Windows a client that tries ::1 first waits for the refused IPv6 attempt before falling back.

x-turnover-image: &turnover-image
  build: .
  image: turnover:local
  # host.docker.internal is this machine, on Linux too: releases can run outside Docker.
  extra_hosts: ['host.docker.internal:host-gateway']

# The routing config is mounted, never baked into the image: TURNOVER_CONFIG_FILE picks another one.
x-config: &config ${TURNOVER_CONFIG_FILE:-./turnover.config.yml}:/app/turnover.config.yml:ro

# The console and the CLI write .turnover/ (and the CLI .env) through bind mounts, so they run as the host user that
# owns them. turnover.sh sets TURNOVER_UID and TURNOVER_GID on Linux; 1000 is the image's `node` user.
x-host-user: &host-user
  user: '${TURNOVER_UID:-1000}:${TURNOVER_GID:-1000}'

services:
  turnover:
    <<: *turnover-image
    command: proxy
    restart: unless-stopped
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      TURNOVER_SERVER_KEY: ${TURNOVER_SERVER_KEY:-} # written by "docker compose run --rm cli init"
      TURNOVER_PREVIEW_TOKEN: ${TURNOVER_PREVIEW_TOKEN:-}
      TURNOVER_SECURE_COOKIES: ${TURNOVER_SECURE_COOKIES:-} # "1": mark the proxy's cookies Secure (behind TLS)
      TURNOVER_ACCESS_LOG: ${TURNOVER_ACCESS_LOG:-} # "0": no access log lines
    ports:
      # The feed on :8081 stays inside the compose network. TURNOVER_PUBLISH_HOST=0.0.0.0 lets phones on your
      # network reach the shop and the console; that requires TURNOVER_JUDGE_TOKEN and TURNOVER_CONSOLE_HOSTS.
      - ${TURNOVER_PUBLISH_HOST:-127.0.0.1}:8080:8080
    volumes:
      - *config
      - turnover-state:/app/.turnover # the last known live release, for cold starts
    networks: [sdk, feed, apps]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/__turnover/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Not on the releases: they're whatever the config lists (the demo shops are in compose.demo.yml).
    depends_on:
      flagsmith:
        condition: service_healthy

  console:
    <<: [*turnover-image, *host-user]
    command: console
    restart: unless-stopped
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      TURNOVER_ADMIN_KEY: ${TURNOVER_ADMIN_KEY:-}
      TURNOVER_EXPERIMENT: ${TURNOVER_EXPERIMENT:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      TURNOVER_FEED_URL: http://turnover:8081
      FLAGSMITH_METRICS_URL: http://flagsmith:9100/metrics
      CONSOLE_HOST: 0.0.0.0 # inside the container; see ports for where it's published
      CONSOLE_DEVICE_PORT: 8091 # other devices: judge link only, never the admin password (see ports)
      # Judge mode (/judge): buttons that drive the whole story. Other devices need the judge link and a listed host.
      TURNOVER_JUDGE_TOKEN: ${TURNOVER_JUDGE_TOKEN:-}
      TURNOVER_CONSOLE_HOSTS: ${TURNOVER_CONSOLE_HOSTS:-}
      TURNOVER_PUBLIC_SHOP_URL: ${TURNOVER_PUBLIC_SHOP_URL:-http://127.0.0.1:8080}
      TURNOVER_PROXY_URL: http://turnover:8080 # where judge mode's simulated visitors go
      TURNOVER_PREVIEW_TOKEN: ${TURNOVER_PREVIEW_TOKEN:-} # reads the proxy's routing headers; the preview link
      TURNOVER_SERVER_KEY: ${TURNOVER_SERVER_KEY:-} # for judge mode's leftover-split check (read-only)
      TURNOVER_DEMO_RATES: ${TURNOVER_DEMO_RATES:-}
      FLAGSMITH_DASHBOARD_URL: ${FLAGSMITH_DASHBOARD_URL:-http://127.0.0.1:8000}
      # The judge tour's "sign in to Flagsmith" step. The password is only shown on this machine (loopback), never to other devices.
      FLAGSMITH_ADMIN_EMAIL: ${FLAGSMITH_ADMIN_EMAIL:-}
      FLAGSMITH_ADMIN_PASSWORD: ${FLAGSMITH_ADMIN_PASSWORD:-}
      TURNOVER_HEALTH_WEBHOOK: ${TURNOVER_HEALTH_WEBHOOK:-} # written by init: Flagsmith Feature Health
      TURNOVER_GUARD: ${TURNOVER_GUARD:-off} # "revert": revert automatically on a clearly losing guardrail
      TURNOVER_GUARD_THRESHOLD: ${TURNOVER_GUARD_THRESHOLD:-0.01}
    ports:
      # The console holds the admin key. :8090 is this machine's console and is only ever published on 127.0.0.1.
      # :8091 is for other devices: every request there needs the judge cookie, whatever Host header it sends.
      # TURNOVER_PUBLISH_HOST=0.0.0.0 lets phones on your network reach :8091; that requires TURNOVER_JUDGE_TOKEN
      # and TURNOVER_CONSOLE_HOSTS.
      - 127.0.0.1:8090:8090
      - ${TURNOVER_PUBLISH_HOST:-127.0.0.1}:8091:8091
    volumes:
      - *config
      - ./.turnover:/app/.turnover # snapshots and the release ledger land on the host
    networks: [default, feed]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8090/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      turnover:
        condition: service_started

  # One-off commands: docker compose run --rm cli <command>
  # (init, demo, status, ship, revert, release, preview, check). It mounts .env so init can write the keys it creates.
  cli:
    <<: [*turnover-image, *host-user]
    profiles: [tools]
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      TURNOVER_PROXY_URL: http://turnover:8080
    volumes:
      - *config
      - ./.env:/app/.env
      - ./.turnover:/app/.turnover
    networks: [default, feed] # Flagsmith's admin API; the proxy and the console (demo, doctor)

networks:
  feed: {}
  apps: {}

volumes:
  turnover-state: {}
