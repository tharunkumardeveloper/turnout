# Server mode: the same stack on a public hostname, behind Caddy with automatic HTTPS. Used as a second file on every
# compose command (turnout.sh / turnout.bat do it when .env says TURNOUT_MODE=server):
#   docker compose -f compose.yaml -f compose.server.yml up -d --build --wait
# Only networking, secrets and start-up change here: the proxy, the console and the experiment logic are the same.
#
#   https://<TURNOUT_HOSTNAME>/        the proxy (your app, through Turnout)
#   https://<TURNOUT_HOSTNAME>/judge   judge mode, read-only and running by itself (GET only; the console's public port, deploy/Caddyfile)
#   Flagsmith (:8000), the console (:8090) and the proxy's own port (:8080) stay on 127.0.0.1: reach them with an
#   SSH tunnel (docs/SETUP.md, "Running on a server"). Needs Docker Compose 2.24+ (!override).
#
# The ${VAR:?…} values below make Compose refuse to start without them; `turnout server-check` also refuses
# placeholders ("secret", "password", short values).

x-restart: &restart
  restart: unless-stopped

x-flagsmith-secrets: &flagsmith-secrets
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run sh turnout.sh server <hostname> (it writes random secrets)}@postgres:5432/flagsmith
  DJANGO_SECRET_KEY: ${FLAGSMITH_DJANGO_SECRET_KEY:?run sh turnout.sh server <hostname> (it writes random secrets)}
  WAREHOUSE_CREDENTIALS_SECRET: ${FLAGSMITH_WAREHOUSE_SECRET:?run sh turnout.sh server <hostname> (it writes random secrets)}

# The image's own health check starts a full Python/Django process (`flagsmith healthcheck tcp`) every 2 s with a
# 2 s timeout. Measured on a 2-vCPU VM: that alone took most of a CPU, and it timed out (container "unhealthy") whenever
# Flagsmith was busy. Same check, run every 30 s with time to answer; every 3 s while starting, so start-up isn't slower.
x-flagsmith-health: &flagsmith-health
  test: ['CMD-SHELL', 'flagsmith healthcheck tcp']
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 120s
  start_interval: 3s

# The shops answer only frames from their own origin: the public judge view is https://<hostname>/judge, same origin.
x-shop-frames: &shop-frames
  <<: *restart
  environment:
    SHOP_FRAME_ANCESTORS: "'self'"

services:
  caddy:
    image: caddy:2.10.2-alpine
    <<: *restart
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      TURNOUT_HOSTNAME: ${TURNOUT_HOSTNAME:?run sh turnout.sh server <hostname>}
      # Empty: a public certificate (Let's Encrypt / ZeroSSL). "tls internal": Caddy's own CA (CI, trying it out).
      TURNOUT_CADDY_TLS: ${TURNOUT_CADDY_TLS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep them, or Let's Encrypt rate limits bite on rebuilds
      - caddy-config:/config
    networks: [edge]
    depends_on:
      turnout:
        condition: service_healthy
      turnout-live:
        condition: service_healthy
      console:
        condition: service_started

  # Real visitors: the public address (https://<hostname>/) reaches this proxy, with its own flag and experiment
  # (turnout.live.yml). The autopilot's simulated visitors use the other proxy, inside the network only.
  turnout-live:
    extends: { file: compose.turnout.yml, service: turnout }
    <<: *restart
    environment:
      TURNOUT_SECURE_COOKIES: '1'
      TURNOUT_STATE_DIR: /app/.turnout/live
      TURNOUT_VIEW_SWITCH: '1' # judges can look at any version (/__turnout/view?release=…), uncounted
    ports: !reset []
    volumes: !override
      - ./turnout.live.yml:/app/turnout.config.yml:ro
      - turnout-state:/app/.turnout
    networks: [sdk, apps, edge]

  turnout:
    <<: *restart
    environment:
      TURNOUT_SECURE_COOKIES: '1'
    ports: !override
      - 127.0.0.1:8080:8080 # whatever TURNOUT_PUBLISH_HOST says
    networks: [sdk, feed, apps] # simulated visitors only: the public way in is Caddy to turnout-live

  # "Try it with your app" builds and runs code over the Docker socket: never on a public server.
  tryit:
    <<: *restart
    profiles: [never]

  console:
    <<: *restart
    environment:
      CONSOLE_PUBLIC_PORT: 8092 # the read-only judge view; Caddy reaches it on the edge network, never published
      TURNOUT_TRYIT_URL: '' # no Try it box on a server (it builds and runs code)
      TURNOUT_TRYIT_CONSOLE_URL: '' # nor your app's console
      TURNOUT_PUBLIC_SHOP_URL: https://${TURNOUT_HOSTNAME}
      TURNOUT_CONSOLE_HOSTS: '' # other devices use the public, read-only view
      # The public view is read-only, so the story runs by itself: the console's autopilot presses the judge buttons
      # (visitors, Flagsmith's results, Turnout's recommendation, verify, preview, release, reset, again), waits out
      # Flagsmith's 5-minute refresh limit, and steps aside for 10 minutes after any action from the private console.
      # It also sends the visitors the public map shows. TURNOUT_AUTOPILOT=off turns it off.
      TURNOUT_AUTOPILOT: ${TURNOUT_AUTOPILOT:-on}
      # Blind rounds: each A/B round's true order rates are drawn at random and hidden (better, worse or the same);
      # the judge page reveals them next to Flagsmith's call after the decision and keeps a scoreboard.
      TURNOUT_BLIND: ${TURNOUT_BLIND:-on}
      # One read of the judge state, shared by every viewer for 3 s (1.5 s locally): half the Flagsmith reads.
      TURNOUT_STATE_CACHE_MS: ${TURNOUT_STATE_CACHE_MS:-3000}
      TURNOUT_LIVE_FLAG: shop_release_live # turnout.live.yml: real visitors, shown next to the simulated story
      # 1,200 per round: enough for Flagsmith to call a 60% lift on its first look, light enough for 2 vCPUs.
      TURNOUT_AUTOPILOT_VISITORS: ${TURNOUT_AUTOPILOT_VISITORS:-1200}
      TURNOUT_AUTOPILOT_PAUSE: ${TURNOUT_AUTOPILOT_PAUSE:-}
      # Simulated visitors in flight. 25 here (50 locally): on 2 vCPUs Flagsmith runs on the same machine and needs room.
      TURNOUT_DEMO_CONCURRENCY: ${TURNOUT_DEMO_CONCURRENCY:-15}
    ports: !override
      - 127.0.0.1:8090:8090
      - 127.0.0.1:8091:8091
    networks: [default, feed, edge]

  # Doctor's server checks reach Caddy by name on the edge network, with the public hostname as SNI and Host.
  cli:
    environment:
      TURNOUT_EDGE_ADDRESS: caddy
      TURNOUT_RESTART_POLICIES: ${TURNOUT_RESTART_POLICIES:-}
    networks: [default, feed, edge]

  # Flagsmith and its Postgres: random secrets instead of the official file's placeholders, and restart on reboot.
  postgres:
    <<: *restart
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run sh turnout.sh server <hostname> (it writes random secrets)}
  migrate-db:
    restart: on-failure # a one-off: it exits 0 when the migrations are done
    environment: *flagsmith-secrets
  flagsmith:
    <<: *restart
    environment: *flagsmith-secrets
    healthcheck: *flagsmith-health
  flagsmith-task-processor:
    <<: *restart
    environment: *flagsmith-secrets
    healthcheck: *flagsmith-health

  # Housekeeping for the always-on autopilot demo only (deploy/prune-events.sh has the rules): Flagsmith never deletes
  # SDK events, and the autopilot sends visitors forever (530,572 events, 228 MB after 10 h made results queries take
  # 37 s). Every 10 minutes, and only while TURNOUT_AUTOPILOT=on, it deletes events older than TURNOUT_EVENT_RETENTION_HOURS
  # (default 1) that are also older than every running, paused or unsnapshotted experiment. Never in normal use.
  event-pruner:
    image: postgres:15.5-alpine
    <<: *restart
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run sh turnout.sh server <hostname> (it writes random secrets)}
      AUTOPILOT: ${TURNOUT_AUTOPILOT:-on}
      # The autopilot makes ~24,000 events every 3 minutes; an hour of them keeps Flagsmith's results queries quick.
      RETENTION_HOURS: ${TURNOUT_EVENT_RETENTION_HOURS:-1}
      PRUNE_EVERY_SECONDS: 600
    entrypoint: ['/bin/sh', '/prune-events.sh']
    volumes:
      - ./deploy/prune-events.sh:/prune-events.sh:ro
      - ./.turnout/snapshots:/snapshots:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The demo's experiments, bounded (deploy/housekeeping.sh): the autopilot starts ~40 an hour, and each leaves a
  # rollout segment in the environment document every proxy fetches every 5 s. Flagsmith's image and its own code.
  flagsmith-housekeeping:
    extends: { file: compose.flagsmith.yml, service: flagsmith-task-processor }
    <<: *restart
    environment:
      <<: *flagsmith-secrets
      AUTOPILOT: ${TURNOUT_AUTOPILOT:-on}
      KEEP: '10'
    entrypoint: ['/bin/sh', '/housekeeping.sh']
    command: []
    healthcheck: { disable: true }
    volumes:
      - ./deploy/housekeeping.sh:/housekeeping.sh:ro
      - ./deploy/housekeeping.py:/housekeeping.py:ro
      - ./.turnout/snapshots:/snapshots:ro

  shop-1-4: *shop-frames
  shop-1-5: *shop-frames
  shop-1-6: *shop-frames

networks:
  edge: {} # Caddy, the proxy and the console's read-only port

volumes:
  caddy-data: {}
  caddy-config: {}
