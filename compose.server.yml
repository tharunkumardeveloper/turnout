# Server mode: the same stack on a public hostname, behind Caddy with automatic HTTPS. Used as a second file on every
# compose command (turnout.sh / turnout.bat do it when .env says TURNOUT_MODE=server):
#   docker compose -f compose.yaml -f compose.server.yml up -d --build --wait
# Only networking, secrets and start-up change here: the proxy, the console and the experiment logic are the same.
#
#   https://<TURNOUT_HOSTNAME>/        the proxy (your app, through Turnout)
#   https://<TURNOUT_HOSTNAME>/judge   judge mode, read-only and running by itself (GET only; the console's public port, deploy/Caddyfile)
#   Flagsmith (:8000), the console (:8090) and the proxy's own port (:8080) stay on 127.0.0.1: reach them with an
#   SSH tunnel (docs/SETUP.md, "Running on a server"). Needs Docker Compose 2.24+ (!override).
#
# The ${VAR:?…} values below make Compose refuse to start without them; `turnout server-check` also refuses
# placeholders ("secret", "password", short values).

x-restart: &restart
  restart: unless-stopped

x-flagsmith-secrets: &flagsmith-secrets
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run sh turnout.sh server <hostname> (it writes random secrets)}@postgres:5432/flagsmith
  DJANGO_SECRET_KEY: ${FLAGSMITH_DJANGO_SECRET_KEY:?run sh turnout.sh server <hostname> (it writes random secrets)}
  WAREHOUSE_CREDENTIALS_SECRET: ${FLAGSMITH_WAREHOUSE_SECRET:?run sh turnout.sh server <hostname> (it writes random secrets)}

# The shops answer only frames from their own origin: the public judge view is https://<hostname>/judge, same origin.
x-shop-frames: &shop-frames
  <<: *restart
  environment:
    SHOP_FRAME_ANCESTORS: "'self'"

services:
  caddy:
    image: caddy:2.10.2-alpine
    <<: *restart
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      TURNOUT_HOSTNAME: ${TURNOUT_HOSTNAME:?run sh turnout.sh server <hostname>}
      # Empty: a public certificate (Let's Encrypt / ZeroSSL). "tls internal": Caddy's own CA (CI, trying it out).
      TURNOUT_CADDY_TLS: ${TURNOUT_CADDY_TLS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep them, or Let's Encrypt rate limits bite on rebuilds
      - caddy-config:/config
    networks: [edge]
    depends_on:
      turnout:
        condition: service_healthy
      console:
        condition: service_started

  turnout:
    <<: *restart
    environment:
      TURNOUT_SECURE_COOKIES: '1'
    ports: !override
      - 127.0.0.1:8080:8080 # whatever TURNOUT_PUBLISH_HOST says: the public way in is Caddy
    networks: [sdk, feed, apps, edge]

  console:
    <<: *restart
    environment:
      CONSOLE_PUBLIC_PORT: 8092 # the read-only judge view; Caddy reaches it on the edge network, never published
      TURNOUT_PUBLIC_SHOP_URL: https://${TURNOUT_HOSTNAME}
      TURNOUT_CONSOLE_HOSTS: '' # other devices use the public, read-only view
      # The public view is read-only, so the story runs by itself: the console's autopilot presses the judge buttons
      # (visitors, Flagsmith's results, Turnout's recommendation, verify, preview, release, reset, again), waits out
      # Flagsmith's 5-minute refresh limit, and steps aside for 10 minutes after any action from the private console.
      # It also sends the visitors the public map shows. TURNOUT_AUTOPILOT=off turns it off.
      TURNOUT_AUTOPILOT: ${TURNOUT_AUTOPILOT:-on}
      TURNOUT_AUTOPILOT_VISITORS: ${TURNOUT_AUTOPILOT_VISITORS:-}
      TURNOUT_AUTOPILOT_PAUSE: ${TURNOUT_AUTOPILOT_PAUSE:-}
    ports: !override
      - 127.0.0.1:8090:8090
      - 127.0.0.1:8091:8091
    networks: [default, feed, edge]

  # Doctor's server checks reach Caddy by name on the edge network, with the public hostname as SNI and Host.
  cli:
    environment:
      TURNOUT_EDGE_ADDRESS: caddy
      TURNOUT_RESTART_POLICIES: ${TURNOUT_RESTART_POLICIES:-}
    networks: [default, feed, edge]

  # Flagsmith and its Postgres: random secrets instead of the official file's placeholders, and restart on reboot.
  postgres:
    <<: *restart
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run sh turnout.sh server <hostname> (it writes random secrets)}
  migrate-db:
    restart: on-failure # a one-off: it exits 0 when the migrations are done
    environment: *flagsmith-secrets
  flagsmith:
    <<: *restart
    environment: *flagsmith-secrets
  flagsmith-task-processor:
    <<: *restart
    environment: *flagsmith-secrets

  # Housekeeping for the always-on demo: the autopilot sends simulated visitors forever, and Flagsmith's SDK event
  # table (experimentation_sdkexperimentationevent) only grows. Measured on a 2-vCPU VM: 530,000 events (228 MB) after
  # 10 hours made Flagsmith's results queries take 37 s and its health check time out. Every hour this deletes events
  # older than TURNOUT_EVENT_RETENTION_HOURS (default 6, several story loops), so finished experiments' raw events go;
  # their results are kept in Turnout's decision snapshots and ledger. TURNOUT_EVENT_RETENTION_HOURS=0 turns it off.
  event-pruner:
    image: postgres:15.5-alpine
    <<: *restart
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run sh turnout.sh server <hostname> (it writes random secrets)}
      HOURS: ${TURNOUT_EVENT_RETENTION_HOURS:-6}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        case "$$HOURS" in *[!0-9]*|"") echo "TURNOUT_EVENT_RETENTION_HOURS must be a whole number"; exit 1;; 0) echo "event pruning off"; exec sleep infinity;; esac
        while :; do
          psql -h postgres -U postgres -d flagsmith -Atc "DELETE FROM experimentation_sdkexperimentationevent WHERE \"timestamp\" < now() - interval '$$HOURS hours'" \
            | sed "s/^/$$(date -u +%FT%TZ) events older than $$HOURS h deleted: /"
          sleep 3600
        done
    depends_on:
      postgres:
        condition: service_healthy

  shop-1-4: *shop-frames
  shop-1-5: *shop-frames
  shop-1-6: *shop-frames

networks:
  edge: {} # Caddy, the proxy and the console's read-only port

volumes:
  caddy-data: {}
  caddy-config: {}
