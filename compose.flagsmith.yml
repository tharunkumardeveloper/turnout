# Flagsmith's official docker-compose.yml (github.com/Flagsmith/flagsmith/blob/main/docker-compose.yml),
# copied unchanged except these edits (2 to 5 are marked "Turnout:" below):
#   1. the image tag is pinned from :latest to :2.291.0 (released 2026-11-13);
#   2. the API's port is published on 127.0.0.1 (this machine) only, instead of every interface;
#   3. the task processor's port is not published (its health check runs inside the container);
#   4. the API also joins the `sdk` network, where the Turnout proxy reaches it without joining `default`;
#   5. the API keeps idle connections open for 5 seconds (GUNICORN_KEEP_ALIVE; Flagsmith's default is 2).

# See https://docs.flagsmith.com/deployment/docker for more information on running Flagsmith in Docker
# This Docker Compose file will run the entire Flagsmith Platform

x-flagsmith-env: &flagsmith-env
  # All environments variables are available here:
  # API: https://docs.flagsmith.com/deployment/locally-api#environment-variables
  # UI: https://docs.flagsmith.com/deployment/locally-frontend#environment-variables

  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true' # Store API and Flag Analytics data in Postgres
  ENVIRONMENT: production # set to 'production' in production.
  DJANGO_ALLOWED_HOSTS: '*' # Change this in production
  FLAGSMITH_DOMAIN: localhost:8000 # Change this in production
  DJANGO_SECRET_KEY: secret # Change this in production
  WAREHOUSE_CREDENTIALS_SECRET: secret # Change this in production
  # PREVENT_SIGNUP: 'true' # Uncomment to prevent any additional signups
  # ALLOW_REGISTRATION_WITHOUT_INVITE: 'true' # Uncomment and set to false to only allow signups via invitations

  # Enable Task Processor
  TASK_RUN_METHOD: TASK_PROCESSOR # other options are: SYNCHRONOUSLY, SEPARATE_THREAD (default)
  PROMETHEUS_ENABLED: 'true'

  # Uncomment if you want to enable Google OAuth. Note this does not turn Google OAuth on. You still need to use
  # Flagsmith on Flagsmith to enable it - https://docs.flagsmith.com/deployment/#oauth_google
  # DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY: 'same-origin-allow-popups'

  # For more info on configuring E-Mails - https://docs.flagsmith.com/deployment/locally-api#environment-variables
  # Example SMTP:
  # EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  # EMAIL_HOST: mail.example.com
  # SENDER_EMAIL: flagsmith@example.com
  # EMAIL_HOST_USER: flagsmith@example.com
  # EMAIL_HOST_PASSWORD: smtp_account_password
  # EMAIL_PORT: 587 # optional
  # EMAIL_USE_TLS: 'true' # optional

  # Lets you try out experimentation by storing SDK events in the Postgres database above.
  # For production, connect a dedicated warehouse.
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:

networks:
  # Turnout: the proxy reads flags and sends events here, without sharing `default` with Postgres and the console.
  sdk: {}

services:
  postgres:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    # Turnout's edit: no container_name (it was flagsmith_postgres), which clashed with any other Flagsmith or Turnout
    # on the same machine. Compose names it per project; the data volume (pgdata) is unchanged.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.291.0
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.291.0
    command:
      - serve
    environment:
      <<: *flagsmith-env
      # Turnout: longer than Node's 4-second idle socket, so the console never sends a request on a connection
      # gunicorn has just closed (common/gunicorn/utils.py:26 in the image reads it; the default is 2).
      GUNICORN_KEEP_ALIVE: 5
    ports:
      # Turnout: this machine only (was 8000:8000 on every interface), whatever TURNOUT_PUBLISH_HOST says. The
      # settings above keep the official placeholder secrets, so the dashboard and admin API stay off your network.
      - 127.0.0.1:8000:8000
    networks: [default, sdk] # Turnout: see networks above
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  # The flagsmith_processor service is only needed if TASK_RUN_METHOD set to TASK_PROCESSOR
  # in the application environment
  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.291.0
    environment:
      <<: *flagsmith-env
    # Turnout: the official file publishes 8001:8000 here. Nothing outside the container uses that port: the image's
    # health check, `flagsmith healthcheck tcp`, connects to 127.0.0.1:8000 from inside the container.
    # Turnout: back after Docker restarts (it exited with Docker Desktop and Flagsmith's results stopped coming).
    restart: unless-stopped
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: run-task-processor

