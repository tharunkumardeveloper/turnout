# Turnout routing config for the demo shop.
flag: shop_release

# Allowlist: release label (the flag's value in Flagsmith) → container.
# The first release is served whenever Flagsmith can't answer or the flag is off.
releases:
  "shop:1.4": http://shop-1-4:8080
  "shop:1.5": http://shop-1-5:8080
  "shop:1.6": http://shop-1-6:8080

goal:
  event: order_placed
  when: { method: POST, path: /checkout, status: 2xx }

# Secondary metrics: shown next to the goal, never a guardrail. The funnel's first step: adding something to the
# cart (the express button answers 200, the plain form a 303 back to the page).
metrics:
  - event: add_to_cart
    when: { method: POST, path: /cart/add, status: "2xx,303" }

# Safety checks. doc_latency_ms and server_error: sent on every page load, measured by the proxy. lcp_ms and cls:
# measured in each visitor's own browser (largest contentful paint, layout shift) by a script the proxy adds to pages.
guardrails: [doc_latency_ms, server_error, lcp_ms, cls]
