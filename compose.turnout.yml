# Turnout, as an overlay on Flagsmith's official compose file (compose.flagsmith.yml). compose.yaml includes both, so plain
# `docker compose …` works from any shell.
#
# Networks: each service joins only the networks it needs.
#   default  Flagsmith, its Postgres, the console and the one-off CLI (the admin side)
#   sdk      Flagsmith and the proxy: flag reads and events (declared in compose.flagsmith.yml)
#   feed     the proxy and the console: the traffic feed (:8081) and judge mode's simulated visitors (:8080)
#   apps     the proxy and the releases (the demo shops, compose.demo.yml): the shops can't reach Flagsmith or the console
# So the public proxy can't reach Postgres or the console's Flagsmith-admin traffic, and each service gets only the
# keys it needs: the proxy never sees the admin key or the admin login.
#
# Published ports are bound to ${TURNOUT_PUBLISH_HOST:-127.0.0.1}. Links use 127.0.0.1 rather than localhost: on
# Windows a client that tries ::1 first waits for the refused IPv6 attempt before falling back.

x-turnout-image: &turnout-image
  build: .
  image: turnout:local
  # host.docker.internal is this machine, on Linux too: releases can run outside Docker.
  extra_hosts: ['host.docker.internal:host-gateway']

# The routing config is mounted, never baked into the image: TURNOUT_CONFIG_FILE picks another one.
x-config: &config ${TURNOUT_CONFIG_FILE:-./turnout.config.yml}:/app/turnout.config.yml:ro

# The console and the CLI write .turnout/ (and the CLI .env) through bind mounts, so they run as the host user that
# owns them. turnout.sh sets TURNOUT_UID and TURNOUT_GID on Linux; 1000 is the image's `node` user.
x-host-user: &host-user
  user: '${TURNOUT_UID:-1000}:${TURNOUT_GID:-1000}'

services:
  turnout:
    <<: *turnout-image
    command: proxy
    restart: unless-stopped
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      TURNOUT_SERVER_KEY: ${TURNOUT_SERVER_KEY:-} # written by "docker compose run --rm cli init"
      TURNOUT_PREVIEW_TOKEN: ${TURNOUT_PREVIEW_TOKEN:-}
      TURNOUT_SECURE_COOKIES: ${TURNOUT_SECURE_COOKIES:-} # "1": mark the proxy's cookies Secure (behind TLS)
      TURNOUT_ACCESS_LOG: ${TURNOUT_ACCESS_LOG:-} # "0": no access log lines
      TURNOUT_VIEW_SWITCH: ${TURNOUT_VIEW_SWITCH:-1} # judge mode previews each version side by side, never counted
    ports:
      # The feed on :8081 stays inside the compose network. TURNOUT_PUBLISH_HOST=0.0.0.0 lets phones on your
      # network reach the shop and the console; that requires TURNOUT_JUDGE_TOKEN and TURNOUT_CONSOLE_HOSTS.
      - ${TURNOUT_PUBLISH_HOST:-127.0.0.1}:8080:8080
    volumes:
      - *config
      - turnout-state:/app/.turnout # the last known live release, for cold starts
    networks: [sdk, feed, apps]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/__turnout/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Not on the releases: they're whatever the config lists (the demo shops are in compose.demo.yml).
    depends_on:
      flagsmith:
        condition: service_healthy

  console:
    <<: [*turnout-image, *host-user]
    command: console
    restart: unless-stopped
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      TURNOUT_ADMIN_KEY: ${TURNOUT_ADMIN_KEY:-}
      TURNOUT_EXPERIMENT: ${TURNOUT_EXPERIMENT:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      TURNOUT_FEED_URL: http://turnout:8081
      FLAGSMITH_METRICS_URL: http://flagsmith:9100/metrics
      CONSOLE_HOST: 0.0.0.0 # inside the container; see ports for where it's published
      CONSOLE_DEVICE_PORT: 8091 # other devices: judge link only, never the admin password (see ports)
      # Judge mode (/judge): buttons that drive the whole story. Other devices need the judge link and a listed host.
      TURNOUT_JUDGE_TOKEN: ${TURNOUT_JUDGE_TOKEN:-}
      TURNOUT_CONSOLE_HOSTS: ${TURNOUT_CONSOLE_HOSTS:-}
      TURNOUT_PUBLIC_SHOP_URL: ${TURNOUT_PUBLIC_SHOP_URL:-http://127.0.0.1:8080}
      TURNOUT_PROXY_URL: http://turnout:8080 # where judge mode's simulated visitors go
      TURNOUT_PREVIEW_TOKEN: ${TURNOUT_PREVIEW_TOKEN:-} # reads the proxy's routing headers; the preview link
      TURNOUT_SERVER_KEY: ${TURNOUT_SERVER_KEY:-} # for judge mode's leftover-split check (read-only)
      TURNOUT_DEMO_RATES: ${TURNOUT_DEMO_RATES:-}
      FLAGSMITH_DASHBOARD_URL: ${FLAGSMITH_DASHBOARD_URL:-http://127.0.0.1:8000}
      # The judge tour's "sign in to Flagsmith" step. The password is only shown on this machine (loopback), never to other devices.
      FLAGSMITH_ADMIN_EMAIL: ${FLAGSMITH_ADMIN_EMAIL:-}
      FLAGSMITH_ADMIN_PASSWORD: ${FLAGSMITH_ADMIN_PASSWORD:-}
      TURNOUT_HEALTH_WEBHOOK: ${TURNOUT_HEALTH_WEBHOOK:-} # written by init: Flagsmith Feature Health
      TURNOUT_GUARD: ${TURNOUT_GUARD:-off} # "revert": revert automatically on a clearly losing guardrail
      TURNOUT_GUARD_THRESHOLD: ${TURNOUT_GUARD_THRESHOLD:-0.01}
    ports:
      # The console holds the admin key. :8090 is this machine's console and is only ever published on 127.0.0.1.
      # :8091 is for other devices: every request there needs the judge cookie, whatever Host header it sends.
      # TURNOUT_PUBLISH_HOST=0.0.0.0 lets phones on your network reach :8091; that requires TURNOUT_JUDGE_TOKEN
      # and TURNOUT_CONSOLE_HOSTS.
      - 127.0.0.1:8090:8090
      - ${TURNOUT_PUBLISH_HOST:-127.0.0.1}:8091:8091
    volumes:
      - *config
      - ./.turnout:/app/.turnout # snapshots and the release ledger land on the host
    networks: [default, feed]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8090/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      turnout:
        condition: service_started

  # One-off commands: docker compose run --rm cli <command>
  # (init, demo, status, ship, revert, release, preview, check). It mounts .env so init can write the keys it creates.
  cli:
    <<: [*turnout-image, *host-user]
    profiles: [tools]
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      TURNOUT_PROXY_URL: http://turnout:8080
    volumes:
      - *config
      - ./.env:/app/.env
      - ./.turnout:/app/.turnout
    networks: [default, feed] # Flagsmith's admin API; the proxy and the console (demo, doctor)

networks:
  feed: {}
  apps: {}

volumes:
  turnout-state: {}
